<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} Chat</title>
<style>
  /* Same mid-century palette as the main page. */
  :root { --bg: #f4ecdf; --panel: #fffaf2; --text: #2b2420; --muted: #7a6a5c; --accent: #1f6f6a; --on-accent: #fffaf2; --user: #f6e6c0;
          --border: #e6d8c3; --mustard: #d6a02f; --serif: Futura, "Futura PT", "Avenir Next", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1713; --panel: #28211c; --text: #f0e7d9; --muted: #b2a290; --accent: #5fb2a6; --on-accent: #0f1f1d; --user: #3a2f17;
            --border: #3d332b; --mustard: #e2b04c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 "Avenir Next", Avenir, -apple-system, system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font: 600 20px/1.1 var(--serif); margin: 0; display: flex; align-items: center; gap: 10px; }
  header h1 img { width: 30px; height: 30px; }
  header a { margin-left: auto; color: var(--accent); font-size: 14px; text-decoration: none; font-weight: 500; }
  header label { color: var(--muted); font-weight: 400; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  select { font: inherit; font-size: 14px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); max-width: 100%; }
  details.thinking { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  details.thinking summary { cursor: pointer; }
  details.thinking div { white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 4px; }
  .model-tag { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { padding: 12px 16px; border-radius: 14px; margin: 10px 0; white-space: pre-wrap; line-height: 1.6; }
  .user { background: var(--user); margin-left: 15%; }
  .assistant { background: var(--panel); border: 1px solid var(--border); margin-right: 15%; }
  .error { color: #b04a32; }
  form { display: flex; gap: 8px; padding: 12px 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
  button { padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 500; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #attach { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 0 14px; font-size: 18px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 760px; width: 100%; margin: 0 auto; padding: 0 16px; }
  #chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--user); font-size: 14px; }
  .chip button { background: none; color: var(--muted); padding: 0; font-size: 16px; line-height: 1; }
  .files { display: block; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  body.dragging #log { outline: 2px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>
<header>
  <h1><img src="/static/logo.svg" alt="">Chat</h1>
  <label>Model <select id="model"><option>Loading…</option></select></label>
  <a href="/">← Back to {{APP_NAME}}</a>
</header>
<div id="log"></div>
<div id="chips"></div>
<form id="form">
  <button type="button" id="attach" title="Attach files (PDF, Word, Excel, CSV, text, code…) — or drag them onto the page">📎</button>
  <input type="file" id="file" multiple hidden>
  <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const messages = []; // the whole conversation, sent each time so the model remembers context

  // MindChart's server only accepts requests carrying this header (see server.py, from_mindchart).
  const plainFetch = window.fetch.bind(window);
  window.fetch = (url, options = {}) => String(url).startsWith("/api/")
    ? plainFetch(url, { ...options, headers: { ...(options.headers || {}), "X-MindChart": "1" } })
    : plainFetch(url, options);

  // Chat is part of MindChart, so it's only available while MindChart is unlocked.
  async function checkUnlocked() {
    const session = await (await fetch("/api/session")).json();
    if (!session.unlocked) location.href = "/";
  }
  checkUnlocked();
  setInterval(checkUnlocked, 30000);

  // Opened by double-clicking index.html instead of through server.py: there's no server to talk to.
  if (location.protocol === "file:") {
    addBubble("assistant error", "This page needs its server. Close this tab and double-click \"Start Chat.command\" in the ClaudeCode folder instead.");
    send.disabled = true;
  }

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // --- Model picker: lists whatever you've downloaded with `ollama pull` ---
  const modelSelect = document.getElementById("model");
  let models = []; // [{ name, size_gb, thinking }]

  async function loadModels() {
    const data = await (await fetch("/api/models")).json();
    if (data.error) { addBubble("assistant error", data.error); return; }
    models = data.models;
    let saved = null;
    try { saved = localStorage.getItem("model"); } catch {}
    const names = models.map((m) => m.name);
    const chosen = names.includes(saved) ? saved : names.includes(data.default) ? data.default : names[0];
    modelSelect.innerHTML = "";
    for (const m of models) {
      const option = document.createElement("option");
      option.value = m.name;
      option.textContent = `${m.name} · ${m.size_gb} GB${m.thinking ? " · thinks" : ""}`;
      modelSelect.appendChild(option);
    }
    modelSelect.value = chosen;
  }

  modelSelect.onchange = () => { try { localStorage.setItem("model", modelSelect.value); } catch {} };
  if (location.protocol !== "file:") loadModels();

  // --- Attachments: files are turned into text by the server, then sent along with the next message ---
  const chips = document.getElementById("chips");
  const fileInput = document.getElementById("file");
  let attachments = []; // [{ name, text }]

  function renderChips() {
    chips.innerHTML = "";
    attachments.forEach((file, i) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = "📎 " + file.name;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.title = "Remove";
      remove.onclick = () => { attachments.splice(i, 1); renderChips(); };
      chip.appendChild(remove);
      chips.appendChild(chip);
    });
  }

  async function addFiles(files) {
    for (const file of files) {
      const res = await fetch("/api/extract?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
      const data = await res.json();
      if (data.error) { addBubble("assistant error", data.error); continue; }
      attachments.push(data);
      renderChips();
      if (data.unclear && data.unclear.length) {  // usually handwriting: the text read from it may be garbled
        addBubble("assistant error", `Parts of ${data.name} were hard to read (page ${data.unclear.join(", ")}), probably handwriting, so some words `
          + "may be wrong and the AI may misread them. For notes, typing or dictating them works far better than photos.");
      }
    }
  }

  document.getElementById("attach").onclick = () => fileInput.click();
  fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ""; };
  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    document.body.classList.remove("dragging");
    addFiles(e.dataTransfer.files);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim() || (attachments.length ? "Please summarize the attached file." : "");
    if (!text) return;
    input.value = "";
    send.disabled = true;

    // The model only sees text, so each file's contents go in front of the message.
    // They stay in the conversation, so follow-up questions about the file work too.
    const fileText = attachments.map((f) => `<file name="${f.name}">\n${f.unclear && f.unclear.length
      ? "[Read from handwriting with OCR; some words are probably misread. Say when something is unclear rather than guessing.]\n" : ""}${f.text}\n</file>\n\n`).join("");
    messages.push({ role: "user", content: fileText + text });
    const userBubble = addBubble("user", text);
    if (attachments.length) {
      const files = document.createElement("span");
      files.className = "files";
      files.textContent = attachments.map((f) => "📎 " + f.name).join("  ");
      userBubble.prepend(files);
    }
    attachments = [];
    renderChips();
    const model = models.find((m) => m.name === modelSelect.value) || { name: modelSelect.value };
    const bubble = addBubble("assistant", "");
    const tag = document.createElement("span");
    tag.className = "model-tag";
    tag.textContent = model.name;
    const answer = document.createElement("span");
    answer.textContent = "…";
    bubble.append(tag, answer);
    let reply = "";
    let thinking = "";
    let thinkingBox = null;
    const started = Date.now();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, model: model.name, think: !!model.thinking }),
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (!line) continue;
          const data = JSON.parse(line);
          if (data.error) throw new Error(data.error);
          if (data.thinking) {
            // Reasoning goes in a fold-out box above the answer, open while it's being written.
            if (!thinkingBox) {
              thinkingBox = document.createElement("details");
              thinkingBox.className = "thinking";
              thinkingBox.open = true;
              thinkingBox.innerHTML = "<summary>Thinking…</summary><div></div>";
              bubble.insertBefore(thinkingBox, answer);
              answer.textContent = "";
            }
            thinking += data.thinking;
            thinkingBox.querySelector("div").textContent = thinking;
          } else {
            if (thinkingBox && !reply) {
              thinkingBox.open = false;
              thinkingBox.querySelector("summary").textContent = `Thought for ${Math.round((Date.now() - started) / 1000)}s`;
            }
            reply += data.text;
            answer.textContent = reply;
          }
          log.scrollTop = log.scrollHeight;
        }
      }
      messages.push({ role: "assistant", content: reply });
    } catch (err) {
      bubble.textContent = "Error: " + err.message + " — is Ollama running?";
      bubble.classList.add("error");
      messages.pop();
      send.disabled = false;
      return;
    }
    if (!reply) {
      bubble.textContent = "The model didn't reply. It may have run out of memory; try a smaller model.";
      bubble.classList.add("error");
      messages.splice(-2); // drop the unanswered question and the empty reply
    }
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
